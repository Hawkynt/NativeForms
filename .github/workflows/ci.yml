name: CI

on:
  pull_request:
    branches: [main]
  workflow_call: {}
  workflow_dispatch: {}

# Pushing three times to a branch used to queue three full matrices and run all of them. A newer
# pull-request run supersedes the older one; a push to main is not cancelled, because main wants a
# recorded result for every commit rather than only for the newest.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Force JavaScript-based actions to run on Node 24 instead of the deprecated Node 20 ahead of
# the 2026-06-16 hard cutover, until we bump each action to a Node-24-native major version.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # The standard part: build the solution on three runners, check the package READMEs against the
  # assemblies, run the suite. Everything below is what this repository has that no other does.
  ci:
    uses: Hawkynt/RepositoryTemplate/.github/workflows/dotnet-ci.yml@v1
    with:
      solution: NativeForms.sln
      dotnet-version: '10.0.x'
      os-matrix: '["ubuntu-latest","windows-latest","macos-latest"]'
      # One runner only: the committed reference must not depend on which machine produced it.
      package-readme-os: ubuntu-latest
      # No coverage leg here — the real signal is the autopilot and the screenshots below.
      coverage: false

  autopilot:
    name: autopilot (linux/gtk)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      # The demo needs GTK itself, and a display to put windows on. Xvfb is enough: the walkthrough
      # injects its input in-process rather than through the X server, so no compositor is involved.
      - name: Install GTK and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-0 xvfb
      - name: Build
        run: dotnet build NativeForms.sln --configuration Release
      # The pass/fail gate for "the demo works and looks right": every page driven with real input,
      # real control state asserted, and a layout audit per page. This is the tier the headless fakes
      # cannot reach — a control sized from a wrong system metric passes every unit test and fails
      # here on the first frame.
      # A gate. This was advisory for a focus flake measured at about one run in four on a
      # window-manager-less Xvfb — nothing assigns the toplevel X focus, so the text-entry checks lose
      # their keystrokes. Re-measured on exactly this configuration after the focus work landed:
      # 8 consecutive runs, 160 of 160 checks each. Against a 25% failure rate that outcome has a 10%
      # chance, so the flake is gone rather than hiding. If it returns, the honest move is to fix the
      # focus, not to make this advisory again.
      - name: Autopilot
        run: >
          xvfb-run -a --server-args="-screen 0 1600x1000x24"
          dotnet run --project NativeForms.Demo --configuration Release --no-build -- --autopilot
      - name: Upload captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autopilot-captures
          path: /tmp/nativeforms-autopilot/*.png
          if-no-files-found: warn

  screenshots:
    name: screenshots (windows)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build NativeForms.sln --configuration Release
      # What the toolkit actually renders on Windows, which nothing else here can answer: the unit
      # tests run against headless fakes and never create a real HWND, and the autopilot above is GTK
      # from top to bottom. This is the only job that puts the gallery on screen with the Win32
      # backend, so it is also the first place a real common control, a real theme and a real DPI get
      # exercised at all.
      #
      # A hosted runner has no interactive desktop session, which is exactly why the capture is
      # in-process (see NativeForms.Demo/Shoot.Windows.cs) rather than a screenshot tool.
      #
      # A gate, not advisory. This job started advisory and immediately found that the gallery could
      # not start on Windows at all — RichTextBox took the process down during realization. That is
      # exactly the class of regression nothing else here can catch, so failing to bring the window up
      # and photograph it now breaks the build.
      - name: Shoot the gallery
        run: dotnet run --project NativeForms.Demo --configuration Release --no-build -- --shoot "${{ runner.temp }}/shots"
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-screenshots
          # The log comes too: a WinExe cannot report a startup failure to a console nobody is
          # attached to, so the artifact has to be able to explain an empty shot on its own.
          path: |
            ${{ runner.temp }}/shots/*.png
            ${{ runner.temp }}/shots/*.log
          if-no-files-found: warn

  macos-probe:
    name: macos probe
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build
        run: dotnet build NativeForms.sln --configuration Release
      # Cocoa now has native window, widget and dialog peers plus in-process screenshot coverage.
      # Keep this as a real platform gate: the ordinary macOS test leg proves the managed contracts,
      # while this job proves the gallery can realize and render through AppKit on the hosted runner.
      # Bounded so a broken native event loop fails usefully rather than consuming the whole job.
      - name: Probe the gallery
        timeout-minutes: 3
        run: dotnet run --project NativeForms.Demo --configuration Release --no-build -- --shoot "${{ runner.temp }}/shots"
      - name: Upload the probe
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-probe
          path: |
            ${{ runner.temp }}/shots/*.png
            ${{ runner.temp }}/shots/*.log
          if-no-files-found: warn

  aot:
    name: aot ${{ matrix.rid }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install NativeAOT prerequisites (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      # Proves the headline goal: the toolkit and demo compile ahead-of-time on every platform.
      # TreatWarningsAsErrors makes any trim/AOT (IL2xxx/IL3xxx) warning fail the build, so
      # trimmability can never silently regress.
      - name: Publish demo with NativeAOT (trim/AOT warnings are errors)
        shell: bash
        run: >
          dotnet publish NativeForms.Demo/NativeForms.Demo.csproj
          --configuration Release --runtime ${{ matrix.rid }} --self-contained
          -p:PublishAot=true -p:TreatWarningsAsErrors=true
          -o aot-out
      # Footprint is a first-class goal — surface the native binary size on every run.
      - name: Report native binary size
        shell: bash
        run: |
          echo "### NativeAOT size — ${{ matrix.rid }}" >> "$GITHUB_STEP_SUMMARY"
          ls -lh aot-out/Hawkynt.NativeForms.Demo* 2>/dev/null | awk '{print $5, $NF}' >> "$GITHUB_STEP_SUMMARY" || true
